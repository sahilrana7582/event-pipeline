services:
  database:
    container_name: events_db
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - events_vol:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrator:
    container_name: events_migrator
    image: migrate/migrate:v4.18.3
    depends_on:
      database:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations:ro

    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?sslmode=disable"
      - "up"

volumes:
  events_vol:
    driver: local
